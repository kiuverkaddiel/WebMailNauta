import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
}

// Load local, git-ignored credentials (see local.properties.sample).
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def nautaUsername = localProperties.getProperty('NAUTA_USERNAME', '')
def nautaPassword = localProperties.getProperty('NAUTA_PASSWORD', '')

android {
    namespace 'kiu.webmailnauta'
    compileSdk 34

    defaultConfig {
        applicationId "kiu.webmailnauta"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "NAUTA_USERNAME", "\"${nautaUsername}\""
        buildConfigField "String", "NAUTA_PASSWORD", "\"${nautaPassword}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            exclude 'META-INF/NOTICE.md'
            exclude 'META-INF/LICENSE.md'
        }
    }

    useLibrary 'org.apache.http.legacy'
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.jsoup

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.gson

    implementation libs.org.jbundle.util.osgi.wrapped.org.apache.http.client

    implementation libs.android.mail
    implementation libs.android.activation

    implementation libs.bcpkix.jdk15on
    implementation libs.bcprov.jdk15on

}